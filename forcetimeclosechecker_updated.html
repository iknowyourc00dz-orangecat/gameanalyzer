<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Force Serve Forensics — Log Analyzer</title>

<style>
:root {
  --bg: #0b0b12;
  --card: #0f1724;
  --muted: #9aa4b2;
  --accent: #3be8c9;
  --danger: #ff6b6b;
  --glass: rgba(255,255,255,0.03);
  --closest-bg: rgba(59,232,201,0.45);
}

body {
  background: var(--bg);
  color: #e6eef6;
  font-family: Poppins, sans-serif;
  margin: 0;
  padding: 24px;
}

.wrap { max-width: 1000px; margin: auto; }

h1 { margin: 0 0 6px; font-size: 26px; }
p.lead { margin: 0 0 14px; color: var(--muted); font-size: 14px; }

.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,.5);
}

textarea, input {
  width: 100%;
  border: none;
  border-radius: 8px;
  background: var(--glass);
  color: #e6eef6;
  padding: 10px;
  font-family: monospace;
  font-size: 14px;
  outline: none;
}

textarea { height: 280px; }

button {
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 10px 18px;
  font-weight: 600;
  cursor: pointer;
  color: #032326;
}

button.secondary {
  background: transparent;
  color: var(--muted);
  border: 1px solid rgba(255,255,255,.2);
}

.small { font-size: 12px; color: var(--muted); }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 8px;
  font-size: 13px;
}

thead th {
  padding: 10px 8px;
  border-bottom: 2px solid rgba(255,255,255,.2);
  color: var(--muted);
  text-align: left;
  background: var(--card);
  cursor: pointer;
  position: sticky;  /* STICKY HEADER */
  top: 0;
  z-index: 5;
}

td {
  padding: 8px;
  border-bottom: 1px solid rgba(255,255,255,.06);
}

tr.closest {
  background: var(--closest-bg);
  font-weight: 700;
  color: #032326;
}

tr:hover {
  background: rgba(59,232,201,0.15);
  cursor: pointer;
}

td.loss { color: var(--danger); font-weight: 600; }
td.win { color: var(--accent); font-weight: 600; }

#searchInput {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  border: none;
  background: var(--glass);
  color: #e6eef6;
}

.copy-toast {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: var(--accent);
  color: #032326;
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: 600;
  opacity: 0;
  transition: 0.25s;
}
.copy-toast.show { opacity: 1; }

footer { font-size: 12px; color: var(--muted); margin-top: 16px; }
</style>
</head>

<body>
<div class="wrap">
<h1>Force Serve Forensics — Log Analyzer</h1>
<p class="lead">Cyan = closest bet BEFORE Force Serve • Red = loss • Green = win • Click any row to copy raw log</p>

<div class="card">
<textarea id="logs" placeholder="Paste raw logs here..."></textarea>
<input id="fsTime" style="margin-top:10px" placeholder="2026/01/10 17:26:30 (GMT+06:00)">

<div style="margin-top:12px;display:flex;gap:10px">
  <button id="analyzeBtn">Analyze</button>
  <button id="exportCsv" class="secondary">Export CSV</button>
</div>

<div id="summary" class="small" style="margin-top:10px"></div>
</div>

<div class="card">
<input id="searchInput" placeholder="Search table...">
<div id="eventsPane" style="max-height:420px;overflow:auto"></div>
</div>

<footer>Always confirm conclusions with DB logs</footer>
</div>

<div class="copy-toast" id="toast">Copied</div>

<script>
function toast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),900);
}

function parseTimestampWithTZ(text){
  const r=/(\d{4}[\/-]\d{1,2}[\/-]\d{1,2})\s+(\d{1,2}:\d{2}:\d{2})(?:\s*\(GMT([+-]\d{2}):?(\d{2})\))?/;
  const m=text.match(r);
  if(!m) return null;
  const d=m[1].replace(/\//g,'-');
  const t=m[2];
  const h=m[3]??'+00';
  const mm=m[4]??'00';
  return { raw:`${m[1]} ${m[2]} (GMT${h}:${mm})`, utc:new Date(`${d}T${t}${h}:${mm}`) };
}

function parseLine(line){
  const p=line.split(/\t|\s{2,}/).filter(Boolean);
  if(p.length<5) return null;

  let ts=null;
  for(let i=0;i<3;i++){ ts=parseTimestampWithTZ(p[i]); if(ts) break; }
  if(!ts) return null;

  const provider=p.find(x=>isNaN(x)&&!x.includes('('))||'Unknown';
  const i=p.indexOf(provider);

  let bet=0, win=0;
  for(let j=i+3;j<p.length;j++){
    let v=p[j].replace(/,/g,'');
    if(/^\(.*\)$/.test(v)) win=-parseFloat(v.replace(/[()]/g,''));
    else if(!bet) bet=parseFloat(v);
    else if(!win) win=parseFloat(v);
  }

  return { timeRaw:ts.raw, utc:ts.utc, provider, category:p[i+1], game:p[i+2], bet, win, raw:line };
}

function parseLogs(raw){
  return raw.split('\n').map(l=>parseLine(l.trim())).filter(Boolean).sort((a,b)=>a.utc-b.utc);
}

function analyze(events, fs){
  let c=null, m=Infinity;
  for(const e of events){
    if(e.utc<fs.utc && fs.utc-e.utc<m){ m=fs.utc-e.utc; c=e; }
  }
  return { closest:c, gap:m };
}

let sortState={};

function render(events, closest){
  const pane=document.getElementById('eventsPane');
  const table=document.createElement('table');

  table.innerHTML=`
    <thead><tr>
      <th data-k="timeRaw">Time</th>
      <th data-k="provider">Provider</th>
      <th data-k="category">Category</th>
      <th data-k="game">Game</th>
      <th data-k="bet">Bet</th>
      <th data-k="win">Win/Loss</th>
    </tr></thead>`;

  const tb=document.createElement('tbody');
  events.forEach(e=>{
    const tr=document.createElement('tr');
    if(e===closest) tr.classList.add('closest');
    tr.innerHTML=`
      <td>${e.timeRaw}</td>
      <td>${e.provider}</td>
      <td>${e.category}</td>
      <td>${e.game}</td>
      <td class="${e.win<0?'loss':'win'}">${e.bet}</td>
      <td class="${e.win<0?'loss':'win'}">${e.win}</td>`;
    tr.onclick=()=>{ navigator.clipboard.writeText(e.raw); toast(); };
    tb.appendChild(tr);
  });

  table.appendChild(tb);
  pane.innerHTML='';
  pane.appendChild(table);

  /* AUTO-SCROLL TO CLOSEST BET */
  setTimeout(()=>{
  const row=pane.querySelector('tr.closest');
  if(row) row.scrollIntoView({ behavior:'smooth', block:'center' });
},150);

  table.querySelectorAll('th').forEach(th=>{
    th.onclick=()=>{
      const k=th.dataset.k;
      const d=sortState[k]==='asc'?'desc':'asc';
      sortState[k]=d;
      events.sort((a,b)=>a[k]<b[k]?(d==='asc'?-1:1):a[k]>b[k]?(d==='asc'?1:-1):0);
      render(events,closest);
      applySearch();
    };
  });
}

function applySearch(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('tbody tr').forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(q)?'':'none';
  });
}
document.getElementById('searchInput').oninput=applySearch;

document.getElementById('analyzeBtn').onclick=()=>{
  const logs=document.getElementById('logs').value.trim();
  const fs=parseTimestampWithTZ(document.getElementById('fsTime').value.trim());
  if(!logs||!fs) return alert('Missing input');

  const events=parseLogs(logs);
  const {closest,gap}=analyze(events,fs);
  render(events,closest);

  document.getElementById('summary').innerHTML=`
    Parsed <b>${events.length}</b> events<br>
    Closest bet: <b>${closest?.timeRaw||'N/A'}</b>
    (${Math.floor(gap/1000)}s before)
    <br><br>
    <button id="copyClosest">Copy</button>
  `;

  document.getElementById('copyClosest').onclick=()=>{
    navigator.clipboard.writeText(closest.raw);
    toast();
  };

  window.__last=events;
};

document.getElementById('exportCsv').onclick=()=>{
  if(!window.__last) return;
  const csv=['Time,Provider,Category,Game,Bet,Win/Loss']
    .concat(window.__last.map(e=>`"${e.timeRaw}","${e.provider}","${e.category}","${e.game}",${e.bet},${e.win}`))
    .join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv]));
  a.download='fs_analysis.csv';
  a.click();
};
</script>
</body>
</html>
