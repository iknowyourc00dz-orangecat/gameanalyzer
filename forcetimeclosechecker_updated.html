<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Force Serve Forensics — Log Analyzer</title>

<style>
:root {
  --bg: #0b0b12;
  --card: #0f1724;
  --muted: #9aa4b2;
  --accent: #3be8c9;
  --danger: #ff6b6b;
  --glass: rgba(255,255,255,0.03);
  --closest-bg: rgba(59, 232, 201, 0.5);
}

body {
  background: var(--bg);
  color: #e6eef6;
  font-family: Poppins,sans-serif;
  margin: 0;
  padding: 24px;
}

.wrap { max-width: 1000px; margin: auto; }

h1 { margin: 0 0 6px; font-size: 26px; }

p.lead { margin: 0 0 14px; color: var(--muted); font-size: 14px; }

.card {
  background: var(--card);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,.5);
}

textarea, input {
  width: 100%;
  border: none;
  border-radius: 8px;
  background: var(--glass);
  color: #e6eef6;
  padding: 10px;
  font-family: monospace;
  font-size: 14px;
  outline: none;
}

textarea { height: 280px; }

button {
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 10px 20px;
  font-weight: 600;
  cursor: pointer;
  color: #032326;
  transition: 0.2s;
}
button:hover { opacity: 0.85; }

button.secondary {
  background: transparent;
  color: var(--muted);
  border: 1px solid rgba(255,255,255,.2);
}

.small { font-size: 12px; color: var(--muted); }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
  font-size: 13px;
}

thead th {
  padding: 10px 8px;
  border-bottom: 2px solid rgba(255,255,255,.2);
  color: var(--muted);
  text-align: left;
  position: sticky;
  top: 0;
  background: var(--card);
  z-index: 1;
  cursor: pointer;
}

td {
  padding: 8px;
  border-bottom: 1px solid rgba(255,255,255,.05);
}

tr.closest {
  background: var(--closest-bg) !important;
  font-weight: 700;
  font-size: 14px;
  color: #032326;
}

tr:hover { background: rgba(59,232,201,0.15); cursor: pointer; }

td.loss { color: var(--danger); font-weight: 600; }
td.win { color: var(--accent); font-weight: 600; }

#searchInput {
  width: 100%;
  padding: 8px 10px;
  margin-bottom: 8px;
  border-radius: 8px;
  border: none;
  background: var(--glass);
  color: #e6eef6;
  font-size: 14px;
  outline: none;
}

footer { font-size: 12px; color: var(--muted); margin-top: 16px; }
</style>
</head>

<body>
<div class="wrap">
<h1>Force Serve Forensics — Log Analyzer</h1>
<p class="lead">Cyan = closest bet BEFORE Force Serve • Red = loss • Green = win. Click any row to copy raw log.</p>

<div class="card">
<label>Paste raw logs</label>
<textarea id="logs"></textarea>

<label style="margin-top:10px">Force Serve time</label>
<input id="fsTime" placeholder="2026/01/10 17:26:30 (GMT+06:00)">

<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
  <button id="analyzeBtn">Analyze</button>
  <button id="exportCsv" class="secondary">Export CSV</button>
</div>

<div id="summary" class="small" style="margin-top:8px; padding:12px; background:rgba(59,232,201,0.1); border-radius:8px;"></div>
</div>

<div class="card">
<h3 class="small">Events</h3>
<input id="searchInput" placeholder="Search table...">
<div id="eventsPane" style="max-height:420px;overflow:auto"></div>
</div>

<footer>Always confirm conclusions with DB logs</footer>
</div>

<script>
function parseTimestampWithTZ(text){
  const re = /(\d{4}[\/-]\d{1,2}[\/-]\d{1,2})\s+(\d{1,2}:\d{2}:\d{2})(?:\s*\(GMT([+-]\d{2}):?(\d{2})\))?/;
  const m = text.match(re);
  if(!m) return null;
  const date = m[1].replace(/\//g,'-');
  const time = m[2];
  const tzH = m[3] ?? '+00';
  const tzM = m[4] ?? '00';
  return { raw: `${m[1]} ${m[2]} (GMT${tzH}:${tzM})`, utc: new Date(`${date}T${time}${tzH}:${tzM}`) };
}

function parseLine(line){
  const parts = line.split(/\t|\s{2,}/).filter(Boolean);
  if(parts.length < 5) return null;

  let ts = parseTimestampWithTZ(parts[0]);
  if(!ts) for(let i=1;i<3;i++){ ts=parseTimestampWithTZ(parts[i]); if(ts) break; }
  if(!ts) return null;

  let provider = parts.find((p,i)=>i>2 && isNaN(parseFloat(p)) && !p.includes('(')) ?? 'Unknown';
  provider = provider.trim();
  let providerIndex = parts.indexOf(provider);
  let category = parts[providerIndex+1] ?? 'Unknown';
  let game = parts[providerIndex+2] ?? 'Unknown';

  let bet=0, win=0;
  for(let i=providerIndex+3;i<parts.length;i++){
    let p = parts[i].replace(/,/g,'').trim();
    if(/^\(.*\)$/.test(p)) win=-parseFloat(p.replace(/[()]/g,''));
    else if(!bet) bet=parseFloat(p);
    else if(!win) win=parseFloat(p);
  }

  return {timeRaw: ts.raw, utc: ts.utc, provider, category, game, bet, win, raw: line};
}

function parseLogs(raw){
  return raw.split('\n').map(l=>l.trim()).filter(Boolean).map(parseLine).filter(Boolean)
             .sort((a,b)=>a.utc-b.utc);
}

/* Closest BEFORE Force Serve */
function analyzeBeforeForceServe(events, fs){
  let closest=null, min=Infinity;
  for(const e of events){
    if(e.utc >= fs.utc) continue;
    const d = fs.utc - e.utc;
    if(d < min){ min=d; closest=e; }
  }
  return { closest, gap:min };
}

let sortState = {};

function render(events, fs, closest){
  const pane=document.getElementById('eventsPane');
  const table=document.createElement('table');
  table.innerHTML=`<thead>
    <tr>
      <th data-col="timeRaw">Time</th>
      <th data-col="provider">Provider</th>
      <th data-col="category">Category</th>
      <th data-col="game">Game</th>
      <th data-col="bet">Bet</th>
      <th data-col="win">Win/Loss</th>
    </tr>
  </thead>`;
  const tbody=document.createElement('tbody');


  for (const e of events) {
    const tr=document.createElement('tr');
    tr.title=e.raw;
    if(e===closest) tr.classList.add('closest');
    tr.innerHTML=`<td>${e.timeRaw}</td>
                  <td>${e.provider}</td>
                  <td>${e.category}</td>
                  <td>${e.game}</td>
                  <td class="${e.win<0?'loss':'win'}">${e.bet}</td>
                  <td class="${e.win<0?'loss':'win'}">${e.win}</td>`;
    tr.onclick=()=>navigator.clipboard.writeText(e.raw);
    tbody.appendChild(tr);
  }

  table.appendChild(tbody);
  pane.innerHTML=''; pane.appendChild(table);

  /* Auto-scroll */
  setTimeout(()=>{
    const row=document.querySelector('tr.closest');
    if(row) row.scrollIntoView({behavior:'smooth',block:'center'});
  },200);

  table.querySelectorAll('thead th').forEach(th=>{
    th.onclick=()=>{
      const col=th.dataset.col;
      const dir=sortState[col]==='asc'?'desc':'asc';
      sortState[col]=dir;
      events.sort((a,b)=>{
        if(a[col]<b[col]) return dir==='asc'?-1:1;
        if(a[col]>b[col]) return dir==='asc'?1:-1;
        return 0;
      });
      render(events,fs,closest);
      applySearch();
    };
  });
}

function applySearch(){
  const q=document.getElementById('searchInput').value.toLowerCase();
  document.querySelectorAll('#eventsPane tbody tr').forEach(r=>{
    r.style.display=r.innerText.toLowerCase().includes(q)?'':'none';
  });
}
document.getElementById('searchInput').addEventListener('input',applySearch);

document.getElementById('analyzeBtn').onclick=()=>{
  const raw=document.getElementById('logs').value.trim();
  const fs=parseTimestampWithTZ(document.getElementById('fsTime').value.trim());
  if(!raw||!fs) return alert('Missing logs or invalid Force Serve time');

  const events=parseLogs(raw);
  const { closest, gap } = analyzeBeforeForceServe(events,fs);

  render(events,fs,closest);

  const gapSec = Math.floor(gap/1000);

  document.getElementById('summary').innerHTML=`
    <strong>Total events:</strong> ${events.length}<br><br>
    <strong>Closest bet BEFORE Force Serve:</strong><br>
    ${closest?.timeRaw || 'N/A'}<br>
    <strong>Time gap:</strong> ${gapSec}s before Force Serve<br><br>
    <strong>Provider:</strong> ${closest?.provider || '-'} |
    <strong>Game:</strong> ${closest?.game || '-'} |
    <strong>Bet:</strong> ${closest?.bet || 0} |
    <strong>Win/Loss:</strong> ${closest?.win || 0}
    <br><br>
    <button id="copyClosest" style="padding:6px 10px;border:none;border-radius:6px;background:var(--accent);cursor:pointer;">Copy</button>
  `;

  document.getElementById('copyClosest').onclick=()=>{
    const t=`Closest BEFORE Force Serve | ${closest.timeRaw} | ${closest.provider} | ${closest.game} | Bet:${closest.bet} | Win/Loss:${closest.win}`;
    navigator.clipboard.writeText(t);
  };

  window.__lastExport=events;
};

document.getElementById('exportCsv').onclick=()=>{
  const r=window.__lastExport||[];
  if(!r.length) return alert('No data to export');
  const csv=['Time,Provider,Category,Game,Bet,Win/Loss']
    .concat(r.map(e=>`"${e.timeRaw}","${e.provider}","${e.category}","${e.game}",${e.bet},${e.win}`))
    .join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download='fs_analysis.csv'; a.click();
};
</script>
</body>
</html>
