<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Force Serve Forensics — Log Analyzer</title>

<style>
:root {
  --bg:#0b0b12;
  --card:#0f1724;
  --muted:#9aa4b2;
  --accent:#3be8c9;
  --danger:#ff6b6b;
  --glass:rgba(255,255,255,.03);
  --closest-bg:rgba(59,232,201,.45);
}
body {
  background:var(--bg);
  color:#e6eef6;
  font-family:Poppins,sans-serif;
  margin:0;
  padding:24px;
}
.wrap { max-width:1100px; margin:auto; }
h1 { margin:0 0 6px; font-size:26px; }
p.lead { margin:0 0 14px; color:var(--muted); font-size:14px; }

.card {
  background:var(--card);
  border-radius:12px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
}

textarea,input {
  width:100%;
  border:none;
  border-radius:8px;
  background:var(--glass);
  color:#e6eef6;
  padding:10px;
  font-family:monospace;
  font-size:14px;
}

textarea { height:260px; }

button {
  background:var(--accent);
  border:none;
  border-radius:8px;
  padding:10px 18px;
  font-weight:600;
  cursor:pointer;
  color:#032326;
}

button.secondary {
  background:transparent;
  color:var(--muted);
  border:1px solid rgba(255,255,255,.2);
}

.small { font-size:12px; color:var(--muted); line-height:1.5; }


table {
  width:100%;
  border-collapse:collapse;
  margin-top:8px;
  font-size:13px;
}

thead th {
  padding:10px 8px;
  border-bottom:2px solid rgba(255,255,255,.2);
  color:var(--muted);
  background:var(--card);
  cursor:pointer;
  position:sticky;
  top:0;
  z-index:5;
}

td {
  padding:8px;
  border-bottom:1px solid rgba(255,255,255,.06);
}

tr.closest {
  background:var(--closest-bg);
  font-weight:700;
  color:#032326;
}

tr:hover { background:rgba(59,232,201,.15); cursor:pointer; }

td.loss { color:var(--danger); font-weight:600; }
td.win { color:var(--accent); font-weight:600; }

.copy-toast {
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--accent);
  color:#032326;
  padding:8px 14px;
  border-radius:8px;
  font-weight:600;
  opacity:0;
  transition:.25s;
}
.copy-toast.show { opacity:1; }

</style>
</head>

<body>
<div class="wrap">

<h1>Force Serve Forensics — Log Analyzer</h1>
<p class="lead">
Cyan = closest bet before Force Serve • Red = loss • Green = win  
<br>Click any row to copy the raw log instantly
</p>

<div class="card">
<textarea id="logs" placeholder="Paste raw betting logs here (tab-separated history)..."></textarea>

<input id="fsTime" style="margin-top:10px" placeholder="Force Serve Time — e.g. 2026/01/10 17:26:30 (GMT+06:00)">

<div style="margin-top:12px;display:flex;gap:10px;flex-wrap:wrap">
  <button id="analyzeBtn">Analyze Logs</button>
  <button id="exportCsv" class="secondary">Export CSV</button>
</div>

<div id="summary" class="small" style="margin-top:10px"></div>
</div>

<div class="card">
<input id="searchInput" placeholder="Search logs… (game, provider, time, amount)">





<div id="eventsPane" style="max-height:440px;overflow:auto;margin-top:10px"></div>
</div>

</div>

<div class="copy-toast" id="toast">Copied</div>

<script>
function toast(){
  const t=document.getElementById('toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),900);
}

function parseTS(text){
  const r=/(\d{4}[\/-]\d{2}[\/-]\d{2})\s+(\d{2}:\d{2}:\d{2})\s*\(GMT([+-]\d{2}):(\d{2})\)/;
  const m=text.match(r);
  if(!m) return null;
  return {
    raw:`${m[1]} ${m[2]} (GMT${m[3]}:${m[4]})`,
    utc:new Date(`${m[1].replace(/\//g,'-')}T${m[2]}${m[3]}:${m[4]}`)
  };
}

function parseLine(line){
  const p=line.split(/\t+/);
  if(p.length < 8) return null;

  const transaction=parseTS(p[0]);
  const create=parseTS(p[2]);
  if(!create) return null;

  let bet=0, win=0;
  for(const v of p){
    const x=v.replace(/,/g,'');
    if(/^\(.*\)$/.test(x)) win=-parseFloat(x.replace(/[()]/g,''));
    else if(!bet && !isNaN(x)) bet=parseFloat(x);
    else if(!win && !isNaN(x)) win=parseFloat(x);
  }

  return {
    transaction,
    create,
    timeRaw:transaction?.raw || '',
    createRaw:create.raw,
    utc:create.utc,
    provider:p[3],
    category:p[4],
    game:p[5],
    bet, win,
    raw:line
  };
}

function parseLogs(raw){
  return raw.split('\n')
    .map(l=>parseLine(l.trim()))
    .filter(Boolean)
    .sort((a,b)=>a.utc-b.utc);
}

function analyze(events, fs) {
  let closest = null;
  let bestCreateGap = Infinity;
  let bestTxnGap = Infinity;
  let fullTie = false;

  for (const e of events) {
    if (e.utc >= fs.utc) continue;

    const createGap = fs.utc - e.utc;
    const txnGap = e.transaction?.utc
      ? fs.utc - e.transaction.utc
      : Infinity;

    if (
      createGap < bestCreateGap ||
      (createGap === bestCreateGap && txnGap < bestTxnGap)
    ) {
      bestCreateGap = createGap;
      bestTxnGap = txnGap;
      closest = e;
      fullTie = false;
    }
    else if (
      createGap === bestCreateGap &&
      txnGap === bestTxnGap
    ) {
      // another event is perfectly identical in timing
      fullTie = true;
    }
  }

  return {
    closest,
    createGap: bestCreateGap,
    transactionGap: bestTxnGap,
    fullTie
  };
}





let sortState = {}; // keep track of current sort per column

function render(events, closest) {
  const pane = document.getElementById('eventsPane');
  const table = document.createElement('table');
  table.innerHTML = `
    <thead><tr>
      <th data-k="timeRaw">Transaction Time</th>
      <th data-k="createRaw">Create Time</th>
      <th data-k="provider">Provider</th>
      <th data-k="category">Category</th>
      <th data-k="game">Game</th>
      <th data-k="bet">Bet</th>
      <th data-k="win">Win/Loss</th>
    </tr></thead>`;
  const tb = document.createElement('tbody');

  function populateRows(data) {
    tb.innerHTML = '';
    data.forEach(e => {
      const tr = document.createElement('tr');
      if (e === closest) tr.classList.add('closest');
      tr.dataset.provider = e.provider.toLowerCase();
      tr.dataset.category = e.category.toLowerCase();
      tr.dataset.game = e.game.toLowerCase();
      tr.dataset.bet = e.bet;
      tr.dataset.win = e.win;

      tr.innerHTML = `
        <td>${e.timeRaw}</td>
        <td>${e.createRaw}</td>
        <td>${e.provider}</td>
        <td>${e.category}</td>
        <td>${e.game}</td>
        <td class="${e.win < 0 ? 'loss' : 'win'}">${e.bet}</td>
        <td class="${e.win < 0 ? 'loss' : 'win'}">${e.win}</td>`;
      
      tr.onclick = () => { navigator.clipboard.writeText(e.raw); toast(); };
      tb.appendChild(tr);
    });
  }

  populateRows(events);
  table.appendChild(tb);
  pane.innerHTML = '';
  pane.appendChild(table);

  // Sorting logic
  table.querySelectorAll('thead th').forEach(th => {
    th.style.cursor = 'pointer';
    th.onclick = () => {
      const key = th.dataset.k;
      let order = sortState[key] === 'asc' ? 'desc' : 'asc';
      sortState[key] = order;

      const sorted = [...events].sort((a, b) => {
        let valA = a[key];
        let valB = b[key];

        // Convert numeric fields to numbers
        if (key === 'bet' || key === 'win') {
          valA = parseFloat(valA);
          valB = parseFloat(valB);
        }
        // Convert date fields to timestamps
        if (key === 'timeRaw' && a.transaction && b.transaction) {
          valA = a.transaction.utc;
          valB = b.transaction.utc;
        }
        if (key === 'createRaw') {
          valA = a.create.utc;
          valB = b.create.utc;
        }

        if (valA < valB) return order === 'asc' ? -1 : 1;
        if (valA > valB) return order === 'asc' ? 1 : -1;
        return 0;
      });

      populateRows(sorted);
      applySearch(); // reapply any active search/filter

      // scroll closest into view again
      setTimeout(() => {
        const row = pane.querySelector('tr.closest');
        if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);
    };
  });

  // scroll closest into view on first render
  setTimeout(() => {
    const row = pane.querySelector('tr.closest');
    if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 150);
}


function applySearch() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();

  document.querySelectorAll('tbody tr').forEach(r => {
    const text = r.innerText.toLowerCase();
    r.style.display = text.includes(q) ? '' : 'none';
  });
}


document.getElementById('searchInput').oninput=applySearch;

document.getElementById('analyzeBtn').onclick=()=>{
  const logs=document.getElementById('logs').value.trim();
  const fs=parseTS(document.getElementById('fsTime').value.trim());
  if(!logs||!fs) return alert('Paste logs and Force Serve time first');

  const events=parseLogs(logs);
  const { closest, createGap, transactionGap, fullTie } = analyze(events, fs);

  render(events,closest);

document.getElementById('summary').innerHTML = `
  Parsed <b>${events.length}</b> events<br>
  Closest Create Time: <b>${closest?.createRaw || 'N/A'}</b><br>
  Closest Transaction Time: <b>${closest?.transaction?.raw || 'N/A'}</b><br><br>

  Gap from <b>Create Time</b>: 
  <b>${Math.floor(createGap / 1000)} seconds</b> before Force Serve<br>

  Gap from <b>Transaction Time</b>: 
  <b>${transactionGap !== null ? Math.floor(transactionGap / 1000) + ' seconds' : 'N/A'}</b> before Force Serve<br>

  ${fullTie ? `
    <div style="margin-top:8px;color:#ffcc66;font-weight:600">
      Multiple identical events detected.  
      Highlighted row is deterministic but equivalent.
    </div>
  ` : ''}

  <br><button id="copyClosest">Copy</button>
`;



  document.getElementById('copyClosest').onclick=()=>{
    navigator.clipboard.writeText(closest.raw);
    toast();
  };

  window.__last=events;
};

document.getElementById('exportCsv').onclick=()=>{
  if(!window.__last) return;
  const csv=['Transaction Time,Create Time,Provider,Category,Game,Bet,Win/Loss']
    .concat(window.__last.map(e=>
      `"${e.timeRaw}","${e.createRaw}","${e.provider}","${e.category}","${e.game}",${e.bet},${e.win}`
    )).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv]));
  a.download='fs_analysis.csv';
  a.click();
};
</script>


</body></html>
